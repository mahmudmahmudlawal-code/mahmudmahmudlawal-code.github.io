<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Portfolio dashboard</title>
<style>:root{--bg:#fff;--fg:#1F2933;--mut:#5B6773;--line:#DCE4EC;--sf:#F3F6FA;--ac:#0A8FAE;--bad:#B3261E}@media(prefers-color-scheme:dark){:root{--bg:#0C1520;--fg:#E3EAF1;--mut:#9AA9B8;--line:#26384B;--sf:#142131;--ac:#3CC4E3;--bad:#F2877F}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding:16px}main{max-width:820px;margin:0 auto}h1{font-size:24px;margin:0 0 4px}
button,select,input,textarea{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--line);border-radius:6px;padding:6px 10px}button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:var(--bad)}
input,textarea,select{width:100%}label{display:block;font-size:13px;color:var(--mut);margin-top:10px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs button[aria-pressed=true]{background:var(--ac);color:#fff}
.row{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}.row b{min-width:48px;color:var(--ac)}.row span{flex:1;min-width:0}#msg{min-height:22px;color:var(--mut)}#msg.bad{color:var(--bad)}
dialog{max-width:640px;width:94%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px}details{background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:12px 0}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}</style></head><body><main>
<h1>Portfolio dashboard</h1><p style="color:var(--mut);margin:0">Add, edit and remove entries. Save sends them to your GitHub repository and the site updates itself.</p>
<details id="cn"><summary>Connect GitHub</summary><label>GitHub username<input id="o"></label><label>Repository name<input id="r"></label><label>Branch<input id="br" value="main"></label><label>Fine-grained token (this repository only, Contents: read and write)<input id="t" type="password" autocomplete="off"></label>
<div class="bar"><button class="p" id="sc">Connect</button><button id="fg">Forget token on this device</button></div></details>
<div class="bar"><button class="p" id="sv">Save changes</button><button id="dl">Download content.json</button><span id="msg"></span></div>
<div class="tabs" id="tabs"></div><div id="list"></div><div class="bar"><button class="p" id="ad">Add new</button></div>
<dialog id="dg"><form method="dialog" id="fm"></form></dialog></main>
<script>
const $=s=>document.querySelector(s),T={profile:'Profile',project:'Projects',publication:'Publications',event:'Conferences',experience:'Experience',volunteer:'Volunteering',certificate:'Certificates'};
const VIS={project:'title year period sub summary tags flow flownote body todo evidence featured',publication:'title year sub links',event:'title year period sub links',experience:'title year period sub body',volunteer:'title year period',certificate:'title year tags links'};
const LAB={title:'Title',year:'Year (used for ordering; leave empty if unknown)',period:'Period shown, e.g. Mar 2018 to Nov 2024',sub:'Subtitle or citation (**bold** allowed)',summary:'Short summary for the card',tags:'Tags, comma separated (certificates: one type)',flow:'Process steps, comma separated',flownote:'Note under the process steps',body:'Page text: "## Heading", "- bullet", **bold**',todo:'Message for missing material (shows a yellow box)',links:'Links, one per line: label | url',evidence:'Evidence, one per line: name | url | note if missing'};
let C,sha,dirty=0,tab='project',cfg=JSON.parse(localStorage.pf||'{}');
const api=p=>`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${p}`,H=()=>({Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'}),br=()=>cfg.branch||'main';
const msg=(t,b)=>{$('#msg').textContent=t;$('#msg').className=b?'bad':''};const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));const enc=s=>btoa(unescape(encodeURIComponent(s)));
async function load(){try{if(cfg.token){const r=await fetch(api('data/content.json')+'?ref='+br(),{headers:H()});if(!r.ok)throw Error('GitHub '+r.status+'. Check username, repository and token.');const j=await r.json();sha=j.sha;C=JSON.parse(dec(j.content));msg('Connected.')}else{C=await(await fetch('../data/content.json')).json();msg('Read-only. Open "Connect GitHub" to enable saving.')}}catch(e){msg('Could not load: '+e.message,1);return}draw()}
function draw(){$('#tabs').innerHTML=Object.keys(T).map(k=>`<button aria-pressed="${k===tab}" data-t="${k}">${T[k]}</button>`).join('');$('#ad').hidden=tab==='profile';
const l=tab==='profile'?[]:C.items.map((x,i)=>[x,i]).filter(a=>a[0].type===tab).sort((a,b)=>(parseInt(a[0].year)||9999)-(parseInt(b[0].year)||9999));
$('#list').innerHTML=tab==='profile'?'<button id="ep">Edit profile and overview text</button>':l.map(([x,i])=>`<div class="row"><b>${E(x.year)||'n/a'}</b><span>${E(x.title)}</span><button data-e="${i}">Edit</button><button class="d" data-x="${i}">Delete</button></div>`).join('')||'<p>Nothing here yet.</p>'}
const ln=(a,n)=>(a||[]).map(r=>r.slice(0,n).join(' | ')).join('\n'),pl=(s,n)=>s.split('\n').map(x=>x.split('|').map(y=>y.trim())).filter(r=>r[0]).map(r=>{while(r.length<n)r.push('');return r});
function form(x,i){const v=VIS[x.type].split(' ');let h=`<h2>${i<0?'Add':'Edit'} ${T[x.type].toLowerCase()}</h2>`;
for(const f of v){const val=f==='tags'||f==='flow'?(x[f]||[]).join(', '):f==='links'?ln(x.links,2):f==='evidence'?ln(x.evidence,3):(x[f]??'');
h+=f==='featured'?`<label><input type="checkbox" id="f_featured" style="width:auto" ${x.featured?'checked':''}> Show on the Overview page</label>`:`<label for="f_${f}">${LAB[f]}</label>`+(['sub','body','todo','links','evidence'].includes(f)?`<textarea id="f_${f}" rows="${f==='body'?9:3}">${E(val)}</textarea>`:`<input id="f_${f}" value="${E(val)}">`)}
if(v.includes('links')||v.includes('evidence'))h+=`<label>Upload a PDF or image (adds it to the list above; needs GitHub connected)<input type="file" id="fu"></label>`;
h+=`<div class="bar"><button class="p" value="ok" id="ok">Done</button><button value="x" formnovalidate>Cancel</button></div>`;$('#fm').innerHTML=h;$('#dg').showModal();
$('#fu')&&($('#fu').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!cfg.token)return msg('Connect GitHub first to upload.',1);msg('Uploading...');const buf=new Uint8Array(await f.arrayBuffer());let s='';buf.forEach(b=>s+=String.fromCharCode(b));const path='uploads/'+Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_');
const r=await fetch(api(path),{method:'PUT',headers:H(),body:JSON.stringify({message:'Upload '+f.name,content:btoa(s),branch:br()})});if(!r.ok)return msg('Upload failed ('+r.status+'). Keep files under about 20 MB.',1);const b=$('#f_evidence')||$('#f_links');b.value+=(b.value?'\n':'')+f.name+' | '+path;msg('Uploaded. Press Done, then Save changes.')});
$('#ok').onclick=e=>{x=Object.assign({},x);for(const f of v){const el=$('#f_'+f),val=el.value;x[f]=f==='featured'?el.checked:f==='tags'||f==='flow'?val.split(',').map(s=>s.trim()).filter(Boolean):f==='links'?pl(val,2):f==='evidence'?pl(val,3):val}
if(!x.title)return;if(!x.id)x.id=(x.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40)||'item')+'-'+Date.now().toString(36);i<0?C.items.push(x):C.items[i]=x;dirty=1;draw();msg('Unsaved changes. Press Save changes.')}}
function pform(){const p=C.profile;const F=[['name','Name'],['eyebrow','Line above the name'],['lede','Headline sentence'],['intro','Introduction'],['email','Email'],['location','Location'],['researchgate','ResearchGate URL'],['footer','Footer text']];
$('#fm').innerHTML='<h2>Profile</h2>'+F.map(f=>`<label>${f[1]}<input id="p_${f[0]}" value="${E(p[f[0]])}"></label>`).join('')+`<label>Order of every list<select id="p_order"><option value="asc" ${p.order==='asc'?'selected':''}>Oldest first</option><option value="desc" ${p.order==='desc'?'selected':''}>Newest first</option></select></label><label>Education: degree | institution | period | grade<textarea id="p_education" rows="3">${E(ln(p.education,4))}</textarea></label><label>Skills: area | tools<textarea id="p_skills" rows="4">${E(ln(p.skills,2))}</textarea></label><label>Research interests, one per line<textarea id="p_interests" rows="4">${E((p.interests||[]).join('\n'))}</textarea></label><div class="bar"><button class="p" id="ok" value="ok">Done</button><button value="x" formnovalidate>Cancel</button></div>`;$('#dg').showModal();
$('#ok').onclick=()=>{F.forEach(f=>p[f[0]]=$('#p_'+f[0]).value);p.order=$('#p_order').value;p.education=pl($('#p_education').value,4);p.skills=pl($('#p_skills').value,2);p.interests=$('#p_interests').value.split('\n').map(s=>s.trim()).filter(Boolean);dirty=1;msg('Unsaved changes. Press Save changes.')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.t){tab=d.t;draw()}else if(d.e)form(C.items[d.e],+d.e);else if(d.x){if(confirm('Delete "'+C.items[d.x].title+'"?')){C.items.splice(d.x,1);dirty=1;draw();msg('Unsaved changes. Press Save changes.')}}else if(b.id==='ad')form({type:tab,year:'',title:''},-1);else if(b.id==='ep')pform()});
$('#sv').onclick=async()=>{if(!cfg.token)return msg('Connect GitHub first, or use Download.',1);const r=await fetch(api('data/content.json'),{method:'PUT',headers:H(),body:JSON.stringify({message:'Update portfolio content',content:enc(JSON.stringify(C,null,1)),sha,branch:br()})});const j=await r.json();if(!r.ok)return msg('Save failed: '+(j.message||r.status),1);sha=j.content.sha;dirty=0;msg('Saved. The live site updates in a minute or two.')};
$('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(C,null,1)],{type:'application/json'}));a.download='content.json';a.click()};
$('#sc').onclick=()=>{cfg={owner:$('#o').value.trim(),repo:$('#r').value.trim(),branch:$('#br').value.trim()||'main',token:$('#t').value.trim()};localStorage.pf=JSON.stringify(cfg);$('#t').value='';load()};
$('#fg').onclick=()=>{localStorage.removeItem('pf');cfg={};$('#o').value=$('#r').value='';msg('Token removed from this device.')};
$('#o').value=cfg.owner||'';$('#r').value=cfg.repo||'';$('#br').value=cfg.branch||'main';onbeforeunload=e=>dirty?'':undefined;load();
</script></body></html>
